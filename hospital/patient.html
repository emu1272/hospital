<form action="save_patient.php" method="POST">

    <label>Patient ID</label>
    <input type="text" name="patient_id" required><br><br>

    <label>Patient Name</label>
    <input type="text" name="patient_name" required><br><br>

    <label>Age</label>
    <input type="number" name="age" required><br><br>

    <label>Gender</label>
    <select name="gender">
        <option>Male</option>
        <option>Female</option>
    </select><br><br>

    <label>Insurance</label>
    <input type="text" name="insurance"><br><br>

    <label>Admission Date</label>
    <input type="date" name="admission_date"><br><br>

    <label>Check-out Date</label>
    <input type="date" name="checkout_date"><br><br>

    <button type="submit">Register</button>

</form>
